[project]
name = "hubstudio-python"
version = "0.1.0"
description = "Knowledge base builder for HubStudio RAG documents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.5",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "PyYAML>=6.0.1",
    "requests>=2.31.0",
    "openpyxl>=3.1.5",
    "langchain>=1.3.2",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.2",
    "pypdf>=6.12.2",
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pymysql>=1.1.0",
]

[project.scripts]
hubstudio-kb = "hubstudio_python.cli:main"
reply-api = "hubstudio_python.reply.app:serve_fastapi"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
