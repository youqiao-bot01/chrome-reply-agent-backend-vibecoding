fields:
  rule_type:
    label: 规则类型
    type: enum
    queryable: true
    condition: true
    excel_header: 规则类型
    values:
    - AI参考话术
    - AI执行动作
    - 策略说明
    - 执行动作
    aliases:
      AI执行动作:
      - 执行动作
  applicable_shops:
    label: 适用店铺
    type: tag_array
    queryable: true
    condition: true
    excel_header: 一级分类-适用店铺
    values:
    - GEN
    note: 各店 slug 见 vocabulary/<shop>.yaml → applicable_shops
  creator_type:
    label: 达人类型（或关系）
    type: tag_array
    queryable: true
    condition: true
    excel_header: 二级分类-达人类型（或关系）
    values:
    - GEN
    - A-level
    - AI UGC达人
    - B-level
    - C-level
    - S-level
    - SS-level
    - 纯佣寄样达人
    - 高GMV达人
    aliases:
      B-level:
      - B-Level
    note: 字段内多值 = OR。店专用档位（如 toolant C-level）见 vocabulary/<shop>.yaml
  creator_type_and:
    label: 达人类型（且关系）
    type: tag_array
    queryable: true
    condition: true
    excel_header: 二级分类-达人类型（且关系）
    values:
    - GEN
    note: 数组内每一项须同时满足（AND）。
  creator_progress:
    label: 达人进度
    type: tag_array
    queryable: true
    condition: true
    excel_header: 三级分类-达人进度
    values:
    - GEN
    - 未发视频
    - 已发视频
    - 未签约
    - 已签约
    - 未上传头部照片
    - 已上传头部照片
    - 未上传全身照
    - 已上传全身照
    - 已加窗
    - 未加窗
    - 已申请批样
    - 未申请批样
    - not join WA
    - joined WA
    - no WA
    - negotiation_rounds=0
    - negotiation_rounds=1
    - negotiation_rounds=2
    - negotiation_rounds=3
    - negotiation_rounds=4
    aliases:
      negotiation_rounds=0:
      - price_negotiation_rounds=0
      negotiation_rounds=1:
      - price_negotiation_rounds=1
      negotiation_rounds=2:
      - price_negotiation_rounds=2
      negotiation_rounds=3:
      - price_negotiation_rounds=3
      negotiation_rounds=4:
      - price_negotiation_rounds=4
    note: 插件 progressLabels；Playbook 议价节点用 other_creator_conditions 的 priority_node:*，勿混写进 progress
  intent_category:
    label: 达人消息意图
    type: enum
    queryable: true
    condition: true
    excel_header: 四级分类-达人消息意图
    values:
    - GEN
    - AI-UGC Earnings
    - Appeal for violation
    - Ask for samples
    - Cancellation Intent
    - Cancellation Intent Handling
    - CPM Rate
    - Creator Quote
    - earnings
    - Encounter difficulties and need help
    - Financial dispute
    - Flat Fee
    - Follower Growth
    - How Many I can earn
    - How to Start
    - I think I need a more suitable product.
    - interest
    - Link with us & Violation Support
    - Manager Inquiry
    - Negotiation
    - No obvious intention
    - ok
    - portrait licensing
    - Pure Commission
    - Reject
    - The other party’s promoted products
    - Video Submission and promote
    - WhatsApp
    - WhatsApp Feedback
    - worry that it's a scam
    aliases:
      interest:
      - 强意向
      Reject:
      - 拒绝
      ok:
      - OK
      - Sure
    note: 与前端 knowledgeIntentCategoryValues 一致；店专用意图（如 CPM Rate）见 vocabulary/<shop>.yaml
  creator_emotion:
    label: 达人情绪
    type: enum
    queryable: true
    condition: true
    excel_header: 达人情绪
    values:
    - GEN
    - 中性
    - 感兴趣或同意
    - 当前聊天主题不感兴趣
    - 拒绝合作
    aliases:
      感兴趣或同意:
      - 感兴趣/同意
      当前聊天主题不感兴趣:
      - 目前对产品问题不感兴趣
    note: 与 CreatorEmotionLabels 一致
  creator_reply_frequency:
    label: 达人回复频率
    type: string
    queryable: true
    condition: true
    values: []
  other_creator_conditions:
    label: 其他达人条件（且关系）
    type: flag_array
    queryable: true
    condition: true
    note: 'JSON 数组；AND。跨店 reply_* / gmv_* 等见各店 vocabulary/<shop>.yaml。

      toolant 议价 priority_node:* / prev_node:* 仅 toolant.yaml。

      '
    groups:
      creator_reply:
      - reply_ok
      - reply_yes
      - reply_reject
      - reply_ai
      - reply_interested
      - reply_wa
  key_information:
    label: 关键信息（需并入最终回复的具体内容）
    type: tag_array
    queryable: false
    note: 不参与规则匹配；各店见 vocabulary/<shop>.yaml
    values: []
    aliases: {}
  restore_slots:
    label: 回复还原槽位
    type: tag_array
    queryable: false
    note: 占位符 ID 列表见 vocabulary/<shop>.yaml；定值见 restore/<shop>.yaml
    values: []
  answer_purpose:
    label: 本条回复要帮达人弄清什么
    type: free_text
    queryable: false
  creator_action_guide:
    label: 达人下一步行动指引
    type: free_text
    queryable: false
  language:
    label: 语言
    type: enum
    values:
    - zh
    - en
