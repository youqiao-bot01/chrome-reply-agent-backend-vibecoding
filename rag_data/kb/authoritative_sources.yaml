# 知识库文档优先级 manifest（rag_data/kb/authoritative_sources.yaml）
#
# priority 说明：
#   authoritative — 最高优先级：structure-playbook 结构化后由 materializer 确定性写入/覆盖，
#                   不依赖 LLM 是否记全；同主题 LLM 产出会被替换。
#   reference     — 仅作为 LLM prompt 参考（与 HTML 同级），不做强制落地。
#
# materializer：authoritative 专用，见 pipelines/playbook_supplement_materializer.py
#
# 新增店铺补充：在此登记 file + materializer，并实现对应 materializer 函数。

version: 1

shops:
  toolant:
    playbook: toolant/linsey-agent-playbook_2.html
    supplements:
      - file: toolant/add1.txt
        priority: authoritative
        materializer: toolant_add1
        note: "运营补充：GMV 分流链接、AI 视频激励、WhatsApp 反馈写库与进度话术"

  Linknlatch:
    supplements: []
