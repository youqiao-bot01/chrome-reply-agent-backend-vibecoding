# ════════════════════════════════════════════════════════════
# 通用词汇表（全项目只有这一份「通用」）
# ════════════════════════════════════════════════════════════
# 对应：Chrome 插件 TS 里的 knowledgeIntentCategoryValues、CreatorEmotionLabels、
#       CreatorConditionLabels —— 任意店铺运行时都会用到的字段取值。
#
# 同目录其它文件：
#   toolant.yaml / Linknlatch.yaml …  → 仅该店铺 Playbook/Excel 多出来的取值
#   merged.yaml                       → 上面全部合并后的运行期文件（程序读它，勿手改）
#
# 不要创建 GEN.yaml：kb/input/GEN/ 是历史误目录，与「通用」无关；通用只维护本 generic.yaml。
#
# 合并命令：uv run python main.py vocabulary --init --force

_meta:
  version: '1.3'
  description: 插件契约 + 跨店词汇表；与前端 knowledgeIntentCategoryValues / CreatorConditionLabels 对齐
  updated: '2026-05-30'
  plugin_contract:
    intent_whitelist: knowledgeIntentCategoryValues
    emotion_labels: CreatorEmotionLabels
    condition_labels: CreatorConditionLabels
  condition_matching:
    summary: 每条规则的非 GEN 条件须全部同时满足（跨字段 AND）；creator_type 字段内多值为 OR；creator_type_and / other_creator_conditions 数组内为 AND。
  sync_sources: []
fields:
  rule_type:
    label: 规则类型
    type: enum
    queryable: true
    condition: true
    excel_header: 规则类型
    values:
    - AI参考话术
    - AI执行动作
    - 策略说明
    - 执行动作
    aliases:
      AI执行动作:
      - 执行动作
  applicable_shops:
    label: 适用店铺
    type: tag_array
    queryable: true
    condition: true
    excel_header: 一级分类-适用店铺
    values:
    - GEN
    note: 各店 slug 见 vocabulary/<shop>.yaml → applicable_shops
  creator_type:
    label: 达人类型（或关系）
    type: tag_array
    queryable: true
    condition: true
    excel_header: 二级分类-达人类型（或关系）
    values:
    - GEN
    - SS-level
    - S-level
    - A-level
    - B-level
    - AI UGC达人
    - 高GMV达人
    - 纯佣寄样达人
    aliases:
      B-level:
      - B-Level
    note: 字段内多值 = OR。店专用档位（如 toolant C-level）见 vocabulary/<shop>.yaml
  creator_type_and:
    label: 达人类型（且关系）
    type: tag_array
    queryable: true
    condition: true
    excel_header: 二级分类-达人类型（且关系）
    values:
    - GEN
    note: 数组内每一项须同时满足（AND）。
  creator_progress:
    label: 达人进度
    type: tag_array
    queryable: true
    condition: true
    excel_header: 三级分类-达人进度
    values:
    - GEN
    - 未发视频
    - 已发视频
    - 未签约
    - 已签约
    - 未上传头部照片
    - 已上传头部照片
    - 未上传全身照
    - 已上传全身照
    - 已加窗
    - 未加窗
    - 已申请批样
    - 未申请批样
    - not join WA
    - joined WA
    - no WA
    - negotiation_rounds=0
    - negotiation_rounds=1
    - negotiation_rounds=2
    - negotiation_rounds=3
    - negotiation_rounds=4
    aliases:
      negotiation_rounds=0:
      - price_negotiation_rounds=0
      negotiation_rounds=1:
      - price_negotiation_rounds=1
      negotiation_rounds=2:
      - price_negotiation_rounds=2
      negotiation_rounds=3:
      - price_negotiation_rounds=3
      negotiation_rounds=4:
      - price_negotiation_rounds=4
    note: 插件 progressLabels；Playbook 议价节点用 other_creator_conditions 的 priority_node:*，勿混写进 progress
  intent_category:
    label: 达人消息意图
    type: enum
    queryable: true
    condition: true
    excel_header: 四级分类-达人消息意图
    values:
    - GEN
    - No obvious intention
    - ok
    - AI-UGC Earnings
    - Follower Growth
    - How Many I can earn
    - Link with us & Violation Support
    - Manager Inquiry
    - Cancellation Intent Handling
    - portrait licensing
    - Encounter difficulties and need help
    - How to Start
    - worry that it's a scam
    - Ask for samples
    - Negotiation
    - WhatsApp
    - interest
    - Reject
    - earnings
    - The other party’s promoted products
    - Appeal for violation
    - Financial dispute
    - I think I need a more suitable product.
    - Video Submission and promote
    aliases:
      interest:
      - 强意向
      Reject:
      - 拒绝
      ok:
      - OK
      - Sure
    note: 与前端 knowledgeIntentCategoryValues 一致；店专用意图（如 CPM Rate）见 vocabulary/<shop>.yaml
  creator_emotion:
    label: 达人情绪
    type: enum
    queryable: true
    condition: true
    excel_header: 达人情绪
    values:
    - GEN
    - 中性
    - 感兴趣或同意
    - 当前聊天主题不感兴趣
    - 拒绝合作
    aliases:
      感兴趣或同意:
      - 感兴趣/同意
      当前聊天主题不感兴趣:
      - 目前对产品问题不感兴趣
    note: 与 CreatorEmotionLabels 一致
  creator_reply_frequency:
    label: 达人回复频率
    type: string
    queryable: true
    condition: true
    values: []
  other_creator_conditions:
    label: 其他达人条件（且关系）
    type: flag_array
    queryable: true
    condition: true
    note: |
      JSON 数组；AND。跨店 reply_* / gmv_* 等见各店 vocabulary/<shop>.yaml。
      toolant 议价 priority_node:* / prev_node:* 仅 toolant.yaml。
    groups:
      creator_reply:
      - reply_ok
      - reply_yes
      - reply_reject
      - reply_ai
      - reply_interested
      - reply_wa
  key_information:
    label: 关键信息（需并入最终回复的具体内容）
    type: tag_array
    queryable: false
    note: 不参与规则匹配；各店见 vocabulary/<shop>.yaml
    values: []
    aliases: {}
  restore_slots:
    label: 回复还原槽位
    type: tag_array
    queryable: false
    note: 占位符 ID 列表见 vocabulary/<shop>.yaml；定值见 restore/<shop>.yaml
    values: []
  answer_purpose:
    label: 本条回复要帮达人弄清什么
    type: free_text
    queryable: false
  creator_action_guide:
    label: 达人下一步行动指引
    type: free_text
    queryable: false
  language:
    label: 语言
    type: enum
    values:
    - zh
    - en
